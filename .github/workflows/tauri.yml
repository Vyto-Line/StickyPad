name: Tauri build (preview)
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src-tauri/**', 'scripts/prep-tauri.js', 'scripts/make-latest-json.js', 'preload.js', '*.html', '*.css', 'note.js', 'all.js', 'chat.js', 'settings.js', 'splash.js', '.github/workflows/tauri.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - name: Prepare the screens
        run: node scripts/prep-tauri.js
      - name: Build the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --yes @tauri-apps/cli@2 build
          else
            echo "::warning::No signing key (secret TAURI_SIGNING_PRIVATE_KEY): building without update files."
            npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Write latest.json (the file the app reads to find updates)
        shell: bash
        run: |
          sig=$(ls src-tauri/target/release/bundle/nsis/*.exe.sig 2>/dev/null | head -1 || true)
          if [ -n "$sig" ]; then
            ver=$(node -p "require('./package.json').version")
            tag="${GITHUB_REF_NAME}"; case "$tag" in v*) ;; *) tag="v$ver" ;; esac
            node scripts/make-latest-json.js "$ver" "$tag" "StickyPad-Tauri-preview-Setup.exe" "$sig" latest.json
          else
            echo "No signature file: latest.json not written."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: StickyPad-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/stickypad.exe
            latest.json
          if-no-files-found: warn
      - name: Name the installer for the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$f" "StickyPad-Tauri-preview-Setup.exe"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            StickyPad-Tauri-preview-Setup.exe
            latest.json
          fail_on_unmatched_files: false
