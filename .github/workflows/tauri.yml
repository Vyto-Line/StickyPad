name: Tauri build (preview)
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src-tauri/**', 'scripts/prep-tauri.js', 'preload.js', '*.html', '*.css', 'note.js', 'all.js', 'chat.js', 'settings.js', 'splash.js', '.github/workflows/tauri.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - name: Prepare the screens
        run: node scripts/prep-tauri.js
      - name: Build the installer
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: StickyPad-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/stickypad.exe
      - name: Name the installer for the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$f" "StickyPad-Tauri-preview-Setup.exe"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: StickyPad-Tauri-preview-Setup.exe
