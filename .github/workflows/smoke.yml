name: Electron smoke test
on: workflow_dispatch
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Start the real app and report
        shell: bash
        run: |
          npx electron tools/smoke.js 2>&1 | tee smoke.txt
          # the report is also written as a notice, so it can be read from the run's annotations without downloading anything
          msg=$(cat smoke.txt | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=SMOKE-REPORT::${msg:0:60000}"
      - uses: actions/upload-artifact@v4
        with: { name: smoke-report, path: smoke.txt }
