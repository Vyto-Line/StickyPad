<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<title>StickyPad</title>
<link rel="stylesheet" href="splash.css">
</head>
<body>
<div class="card">
  <i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
  <div class="glow"></div>
  <svg class="note" viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#FFD24D"/></linearGradient>
    </defs>
    <rect x="12" y="12" width="96" height="96" rx="12" fill="url(#g)"/>
    <path class="fold" d="M108 70 L70 108 L96 108 Q108 108 108 96 Z" fill="#E0A81E"/>
    <path class="ln l1" d="M30 38 H72"/>
    <path class="ln l2" d="M30 54 H84"/>
    <path class="ln l3" d="M30 70 H56"/>
    <path class="tick" d="M64 80 L74 90 L94 64"/>
  </svg>
  <h1 class="name">StickyPad</h1>
  <p id="greet" class="greet"></p>
</div>
<script src="splash.js"></script>
</body>
</html>
