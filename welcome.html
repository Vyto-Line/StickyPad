<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Welcome to StickyPad</title>
<link rel="stylesheet" href="welcome.css">
<script src="apptheme.js"></script>
</head>
<body>
<main>
  <div id="card" role="group" aria-live="polite">
    <div id="icon" aria-hidden="true"></div>
    <h1 id="title"></h1>
    <div id="text"></div>
    <div id="extra"></div>
  </div>
  <div id="dots" role="tablist" aria-label="Steps"></div>
</main>
<footer>
  <button id="skip" class="btn quiet" type="button">Skip</button>
  <span class="grow"></span>
  <button id="back" class="btn" type="button">Back</button>
  <button id="next" class="btn primary" type="button">Next</button>
</footer>
<script src="welcome.js"></script>
</body>
</html>
