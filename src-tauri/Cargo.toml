[package]
name = "stickypad"
version = "1.15.5"
description = "Colourful sticky notes with a local AI helper"
authors = ["Vyto-Line"]
license = "MIT"
edition = "2021"

[lib]
name = "stickypad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
